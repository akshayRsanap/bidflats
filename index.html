<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BidFlats - Bank Auction Properties India</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#1a56db;--primary-light:#e8effc;--primary-dark:#1042a3;
  --accent:#f59e0b;--accent-light:#fef3c7;
  --success:#10b981;--danger:#ef4444;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;
  --gray-800:#1f2937;--gray-900:#111827;
  --radius:12px;--shadow:0 4px 20px rgba(0,0,0,.08);--shadow-lg:0 10px 40px rgba(0,0,0,.12);
}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--gray-50);color:var(--gray-800)}
.header{background:white;border-bottom:1px solid var(--gray-200);position:sticky;top:0;z-index:100;padding:0 24px}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;color:var(--primary);text-decoration:none}
.logo-icon{width:36px;height:36px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:18px}
.nav{display:flex;align-items:center;gap:8px}
.nav-btn{padding:8px 16px;border-radius:8px;border:none;background:transparent;color:var(--gray-600);font-size:14px;font-weight:500;cursor:pointer;transition:.2s}
.nav-btn:hover{background:var(--gray-100);color:var(--gray-800)}
.nav-btn.active{background:var(--primary-light);color:var(--primary)}
.fav-count{background:var(--danger);color:white;font-size:11px;padding:1px 6px;border-radius:10px;font-weight:700;margin-left:4px}
.hero{background:linear-gradient(135deg,#1a56db 0%,#1e3a8a 50%,#312e81 100%);padding:48px 24px 56px;overflow:hidden;position:relative}
.hero-inner{max-width:900px;margin:0 auto;text-align:center;position:relative;z-index:1}
.hero h1{color:white;font-size:32px;font-weight:800;margin-bottom:8px}
.hero p{color:rgba(255,255,255,.8);font-size:16px;margin-bottom:28px}
.search-box{background:white;border-radius:16px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;box-shadow:var(--shadow-lg)}
.search-field{flex:1;min-width:150px;position:relative}
.search-field label{position:absolute;top:6px;left:14px;font-size:10px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.5px;pointer-events:none}
.search-field select{width:100%;border:2px solid var(--gray-200);border-radius:10px;padding:22px 14px 8px;font-size:14px;font-weight:500;appearance:none;outline:none;background:white;cursor:pointer}
.search-field select:focus{border-color:var(--primary)}
.search-btn{background:var(--primary);color:white;border:none;border-radius:10px;padding:14px 32px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s}
.search-btn:hover{background:var(--primary-dark);transform:translateY(-1px)}
.stats-bar{background:white;border-bottom:1px solid var(--gray-200);padding:12px 24px}
.stats-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.stats-left{display:flex;align-items:center;gap:16px;font-size:14px;color:var(--gray-600)}
.stats-left strong{color:var(--gray-900);font-size:18px}
.view-toggle{display:flex;border:2px solid var(--gray-200);border-radius:8px;overflow:hidden}
.view-btn{padding:8px 16px;border:none;background:white;cursor:pointer;font-size:13px;font-weight:600;color:var(--gray-500)}
.view-btn.active{background:var(--primary);color:white}
.sort-select{padding:8px 12px;border:2px solid var(--gray-200);border-radius:8px;font-size:13px;font-weight:500;outline:none;cursor:pointer}
.main{max-width:1400px;margin:0 auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{background:white;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:.3s;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.card-img{height:200px;position:relative;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .card-img img{transform:scale(1.05)}
.card-badge{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
.badge{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.badge-type{background:var(--primary);color:white}
.badge-live{background:var(--danger);color:white;animation:pulse 2s infinite}
.badge-upcoming{background:var(--accent);color:var(--gray-900)}
.badge-discount{background:var(--success);color:white}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.card-fav{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.2s}
.card-fav:hover{transform:scale(1.15)}
.card-fav.active{background:var(--danger);color:white}
.card-body{padding:16px}
.card-title{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-location{font-size:13px;color:var(--gray-500);margin-bottom:12px}
.card-prices{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--gray-100)}
.reserve-label{font-size:10px;color:var(--gray-400);text-transform:uppercase;font-weight:600;letter-spacing:.5px}
.reserve-price{font-size:22px;font-weight:800;color:var(--success)}
.market-value{font-size:13px;color:var(--gray-400);text-decoration:line-through}
.discount-pct{font-size:12px;color:var(--success);font-weight:700}
.card-meta{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.meta-item{font-size:12px;color:var(--gray-500);background:var(--gray-50);padding:3px 8px;border-radius:6px}
.card-countdown{background:var(--accent-light);border-radius:8px;padding:10px;text-align:center}
.countdown-label{font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.countdown-timer{display:flex;justify-content:center;gap:8px}
.countdown-unit{text-align:center}
.countdown-num{font-size:20px;font-weight:800;color:var(--gray-900);background:white;border-radius:6px;padding:4px 8px;min-width:36px}
.countdown-txt{font-size:9px;color:var(--gray-400);text-transform:uppercase;margin-top:2px}
.card-countdown.live{background:#fef2f2}
.card-countdown.live .countdown-label{color:var(--danger)}
.card-countdown.live .countdown-num{color:var(--danger)}
.map-container{display:none;height:calc(100vh - 250px);min-height:500px;border-radius:var(--radius);overflow:hidden}
.map-container.active{display:block}
.grid.hidden{display:none}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:500;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:white;border-radius:16px;max-width:900px;width:100%;max-height:90vh;overflow-y:auto;animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-close{position:sticky;top:12px;float:right;margin:12px;width:36px;height:36px;border-radius:50%;border:none;background:var(--gray-100);cursor:pointer;font-size:18px;z-index:10}
.modal-close:hover{background:var(--gray-200)}
.modal-gallery{height:300px;overflow:hidden}
.modal-gallery img{width:100%;height:100%;object-fit:cover}
.modal-body{padding:28px}
.modal-title{font-size:24px;font-weight:800;color:var(--gray-900);margin-bottom:4px}
.modal-location{font-size:15px;color:var(--gray-500);margin-bottom:20px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.modal-section{background:var(--gray-50);border-radius:10px;padding:16px}
.modal-section h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-400);margin-bottom:8px;font-weight:700}
.modal-row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;border-bottom:1px solid var(--gray-100)}
.modal-row:last-child{border-bottom:none}
.modal-row span:first-child{color:var(--gray-500)}
.modal-row span:last-child{font-weight:600;color:var(--gray-800)}
.modal-cta{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.btn{padding:12px 24px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}
.btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:white;color:var(--primary);border:2px solid var(--primary)}.btn-outline:hover{background:var(--primary-light)}
.btn-success{background:var(--success);color:white}
.empty-state{text-align:center;padding:80px 20px;color:var(--gray-400)}
.empty-state .icon{font-size:64px;margin-bottom:16px}
.empty-state h3{font-size:20px;color:var(--gray-600);margin-bottom:8px}
.fav-panel{position:fixed;top:0;right:-400px;width:380px;height:100%;background:white;z-index:400;box-shadow:-10px 0 40px rgba(0,0,0,.15);transition:.3s}
.fav-panel.open{right:0}
.fav-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);z-index:399}
.fav-overlay.open{display:block}
.fav-panel-header{padding:20px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center}
.fav-panel-header h3{font-size:18px;font-weight:700}
.fav-panel-close{width:32px;height:32px;border-radius:8px;border:none;background:var(--gray-100);cursor:pointer;font-size:16px}
.fav-item{display:flex;gap:12px;padding:14px 20px;border-bottom:1px solid var(--gray-100);cursor:pointer;transition:.15s}
.fav-item:hover{background:var(--gray-50)}
.fav-item img{width:80px;height:60px;border-radius:8px;object-fit:cover}
.fav-item-info h4{font-size:14px;font-weight:600;margin-bottom:2px}
.fav-item-info p{font-size:12px;color:var(--gray-500)}
.fav-item-price{font-size:15px;font-weight:700;color:var(--success);margin-top:4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--gray-900);color:white;padding:12px 24px;border-radius:100px;font-size:14px;font-weight:500;z-index:9999;transition:.3s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.amenity-tag{display:inline-block;background:var(--primary-light);color:var(--primary);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin:3px}
@media(max-width:768px){
  .hero h1{font-size:24px}.search-box{flex-direction:column}.search-field{min-width:100%}
  .grid{grid-template-columns:1fr}.modal-grid{grid-template-columns:1fr}
  .stats-inner{flex-direction:column;align-items:flex-start}.fav-panel{width:100%}
}

.pagination{display:flex;justify-content:center;align-items:center;gap:6px;padding:24px 20px;flex-wrap:wrap}
.page-btn{padding:7px 14px;border-radius:8px;border:2px solid var(--gray-200);background:white;cursor:pointer;font-size:13px;font-weight:600;color:var(--gray-600);transition:.15s}
.page-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.page-btn.active{background:var(--primary);color:white;border-color:var(--primary)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-info{font-size:13px;color:var(--gray-500);padding:0 8px}
.loading-bar{text-align:center;padding:40px;font-size:16px;color:var(--gray-500)}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a href="#" class="logo"><div class="logo-icon">&#127968;</div>BidFlats</a>
    <nav class="nav">
      <button class="nav-btn active">&#127968; Home</button>
      <button class="nav-btn" onclick="toggleFavPanel()">&#10084; Saved <span class="fav-count" id="favCount">0</span></button>
      <button class="nav-btn" onclick="showToast('Alerts coming soon!')">&#128276; Alerts</button>
    </nav>
  </div>
</header>
<section class="hero">
  <div class="hero-inner">
    <h1>Find Bank Auction Properties at Up to 40% Below Market</h1>
    <p>Browse verified SARFAESI auction listings from 25+ banks across India</p>
    <div class="search-box">
      <div class="search-field"><label>City</label>
        <select id="filterCity" onchange="applyFilters()">
          <option value="">All Cities</option>
        </select>
      </div>
      <div class="search-field"><label>Price Range</label>
        <select id="filterPrice" onchange="applyFilters()">
          <option value="">Any Price</option><option value="0-25">Under Rs.25 Lakh</option>
          <option value="25-50">Rs.25L - Rs.50L</option><option value="50-100">Rs.50L - Rs.1 Cr</option>
          <option value="100-200">Rs.1 Cr - Rs.2 Cr</option><option value="200-9999">Above Rs.2 Cr</option>
        </select>
      </div>
      <div class="search-field"><label>Property Type</label>
        <select id="filterType" onchange="applyFilters()">
          <option value="">All Types</option>
        </select>
      </div>
      <div class="search-field"><label>Bank</label>
        <select id="filterBank" onchange="applyFilters()">
          <option value="">All Banks</option>
        </select>
      </div>
      <button class="search-btn" onclick="applyFilters()">Search</button>
    </div>
  </div>
</section>
<div class="stats-bar">
  <div class="stats-inner">
    <div class="stats-left">
      <span><strong id="resultCount">0</strong> properties found</span>
      <span>|</span>
      <span id="liveCount">0</span> live auctions <span style="margin-left:12px;padding:2px 10px;background:var(--primary-light);color:var(--primary);border-radius:20px;font-size:12px;font-weight:600" id="dataSource">Sample data</span>
    </div>
    <div style="display:flex;gap:12px;align-items:center">
      <select class="sort-select" id="sortSelect" onchange="applyFilters()">
        <option value="date-asc">Auction Date (Soonest)</option>
        <option value="price-asc">Price (Low to High)</option>
        <option value="price-desc">Price (High to Low)</option>
        <option value="discount">Best Discount</option>
      </select>
      <div class="view-toggle">
        <button class="view-btn active" id="gridViewBtn" onclick="setView('grid')">&#9638; Grid</button>
        <button class="view-btn" id="mapViewBtn" onclick="setView('map')">Map</button>
      </div>
      <button onclick="downloadCSV()" style="background:#10b981;color:white;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px">&#11015; Download Excel</button>
    </div>
  </div>
</div>
<main class="main">
  <div class="grid" id="propertyGrid"><div class="loading-bar">Loading listings&hellip;</div></div>
  <div id="paginationBar" class="pagination"></div>
  <div class="map-container" id="mapContainer"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="icon">&#127962;</div>
    <h3>No properties match your filters</h3>
    <p>Try adjusting your search criteria</p>
  </div>
</main>
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>
<div class="fav-overlay" id="favOverlay" onclick="toggleFavPanel()"></div>
<div class="fav-panel" id="favPanel">
  <div class="fav-panel-header">
    <h3>&#10084; Saved Properties</h3>
    <button class="fav-panel-close" onclick="toggleFavPanel()">&#10005;</button>
  </div>
  <div id="favList"></div>
</div>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── State ──────────────────────────────────────────────────────────────
var properties = [];
var filteredProperties = [];
var favorites = JSON.parse(localStorage.getItem('bidflats_favs') || '[]');
var currentView = 'grid';
var map = null, markers = [];
var currentPage = 1;
var PAGE_SIZE = 50;
var countdownIntervals = [];

// ── Utilities ──────────────────────────────────────────────────────────
function fmtP(l) {
  if (!l) return 'N/A';
  if (l >= 100) return 'Rs.' + (l / 100).toFixed(2) + ' Cr';
  return 'Rs.' + l + 'L';
}
function pctDisc(r, m) {
  if (!m || m <= r) return 0;
  return Math.round((m - r) / m * 100);
}
function timeLeft(d) {
  var diff = new Date(d) - Date.now();
  if (diff < 0) return { days: 0, hours: 0, minutes: 0, seconds: 0 };
  var s = Math.floor(diff / 1000);
  return { days: Math.floor(s / 86400), hours: Math.floor(s % 86400 / 3600), minutes: Math.floor(s % 3600 / 60), seconds: s % 60 };
}
function pad(n) { return String(n).padStart(2, '0'); }

// ── Populate filter dropdowns from data ──────────────────────────────
function populateFilters(props) {
  // Cities
  var cities = {};
  props.forEach(function(p) { if (p.city) cities[p.city] = (cities[p.city] || 0) + 1; });
  var topCities = Object.keys(cities).sort(function(a, b) { return cities[b] - cities[a]; }).slice(0, 50);
  var cityEl = document.getElementById('filterCity');
  cityEl.innerHTML = '<option value="">All Cities</option>';
  topCities.forEach(function(c) {
    var o = document.createElement('option');
    o.value = c; o.textContent = c + ' (' + cities[c] + ')';
    cityEl.appendChild(o);
  });

  // Property types
  var types = {};
  props.forEach(function(p) { if (p.type) types[p.type] = (types[p.type] || 0) + 1; });
  var topTypes = Object.keys(types).sort(function(a, b) { return types[b] - types[a]; }).slice(0, 30);
  var typeEl = document.getElementById('filterType');
  typeEl.innerHTML = '<option value="">All Types</option>';
  topTypes.forEach(function(t) {
    var o = document.createElement('option');
    o.value = t; o.textContent = t + ' (' + types[t] + ')';
    typeEl.appendChild(o);
  });

  // Banks (by bankFull for display, bank for filter value)
  var banks = {};
  props.forEach(function(p) { if (p.bankFull) banks[p.bankFull] = (banks[p.bankFull] || 0) + 1; });
  var topBanks = Object.keys(banks).sort(function(a, b) { return banks[b] - banks[a]; }).slice(0, 40);
  var bankEl = document.getElementById('filterBank');
  bankEl.innerHTML = '<option value="">All Banks</option>';
  topBanks.forEach(function(b) {
    var o = document.createElement('option');
    o.value = b; o.textContent = b + ' (' + banks[b] + ')';
    bankEl.appendChild(o);
  });
}

// ── Filters & Sort ────────────────────────────────────────────────────
function applyFilters() {
  var city = document.getElementById('filterCity').value,
      price = document.getElementById('filterPrice').value,
      type = document.getElementById('filterType').value,
      bank = document.getElementById('filterBank').value,
      sort = document.getElementById('sortSelect').value;

  var f = properties.filter(function(p) {
    if (city && p.city !== city) return false;
    if (type && p.type !== type) return false;
    if (bank && p.bankFull !== bank && p.bank !== bank) return false;
    if (price) {
      var pts = price.split('-').map(Number);
      if (p.reservePrice < pts[0] || p.reservePrice > pts[1]) return false;
    }
    return true;
  });

  f.sort(function(a, b) {
    if (sort === 'price-asc') return a.reservePrice - b.reservePrice;
    if (sort === 'price-desc') return b.reservePrice - a.reservePrice;
    if (sort === 'discount') return pctDisc(b.reservePrice, b.marketValue) - pctDisc(a.reservePrice, a.marketValue);
    var da = a.auctionDate ? new Date(a.auctionDate) : new Date('9999');
    var db = b.auctionDate ? new Date(b.auctionDate) : new Date('9999');
    return da - db;
  });

  filteredProperties = f;
  currentPage = 1;
  renderCards(f);
  if (currentView === 'map') renderMap(f);
}

// ── Card Rendering with Pagination ───────────────────────────────────
function renderCards(props) {
  var grid = document.getElementById('propertyGrid');
  var totalPages = Math.max(1, Math.ceil(props.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;

  var start = (currentPage - 1) * PAGE_SIZE;
  var page = props.slice(start, start + PAGE_SIZE);

  var live = props.filter(function(p) { return p.status === 'live'; }).length;
  document.getElementById('resultCount').textContent = props.length.toLocaleString('en-IN');
  document.getElementById('liveCount').textContent = live;

  if (!page.length) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">&#127968;</div><h3>No properties found</h3><p>Try adjusting your filters.</p></div>';
    document.getElementById('paginationBar').innerHTML = '';
    return;
  }

  grid.innerHTML = page.map(function(p) {
    var d = pctDisc(p.reservePrice, p.marketValue);
    var live = p.status === 'live';
    var fav = favorites.indexOf(p.id) !== -1;
    var t = timeLeft(p.auctionDate);
    var sqftTxt = p.sqft && p.sqft > 0 ? p.sqft + ' sq.ft' : '';
    return '<div class="card" onclick="openModal(' + p.id + ')">' +
      '<div class="card-img"><img loading="lazy" src="' + p.img + '" alt="' + p.title + '" onerror="this.src=\'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400&q=70\'">' +
      '<div class="card-badge"><span class="badge badge-type">' + p.type + '</span>' +
      (live ? '<span class="badge badge-live">&#9679; LIVE</span>' : '<span class="badge badge-upcoming">UPCOMING</span>') +
      (d > 0 ? '<span class="badge badge-discount">' + d + '% off</span>' : '') + '</div>' +
      '<button class="card-fav' + (fav ? ' active' : '') + '" onclick="event.stopPropagation();toggleFav(' + p.id + ')">' + (fav ? '&#10084;' : '&#9825;') + '</button>' +
      '</div>' +
      '<div class="card-body">' +
      '<div class="card-title">' + p.title + '</div>' +
      '<div class="card-location">&#128205; ' + (p.area ? p.area + ', ' : '') + p.city + (p.state ? ', ' + p.state : '') + '</div>' +
      '<div class="card-prices">' +
        '<div><div class="reserve-label">Reserve Price</div><div class="reserve-price">' + fmtP(p.reservePrice) + '</div></div>' +
        (d > 0 ? '<div><div class="market-value">' + fmtP(p.marketValue) + '</div><div class="discount-pct">&#8595; ' + d + '% below market</div></div>' : '') +
      '</div>' +
      '<div class="card-meta">' +
        (sqftTxt ? '<span class="meta-item">&#128247; ' + sqftTxt + '</span>' : '') +
        '<span class="meta-item">&#127978; ' + (p.bankFull || p.bank) + '</span>' +
        '<span class="meta-item">&#128197; ' + (p.auctionDate ? new Date(p.auctionDate).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) : 'TBD') + '</span>' +
      '</div>' +
      (p.auctionDate ? '<div class="card-countdown' + (live ? ' live' : '') + '">' +
        '<div class="countdown-label">' + (live ? '&#128308; Ends In' : '&#8987; Starts In') + '</div>' +
        '<div class="countdown-timer" data-date="' + p.auctionDate + '">' +
          '<div class="countdown-unit"><div class="countdown-num">' + t.days + '</div><div class="countdown-txt">Days</div></div>' +
          '<div class="countdown-unit"><div class="countdown-num">' + pad(t.hours) + '</div><div class="countdown-txt">Hrs</div></div>' +
          '<div class="countdown-unit"><div class="countdown-num">' + pad(t.minutes) + '</div><div class="countdown-txt">Min</div></div>' +
        '</div></div>' : '') +
      '</div></div>';
  }).join('');

  startCountdowns();
  renderPagination(props.length, totalPages);
  grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderPagination(total, totalPages) {
  var bar = document.getElementById('paginationBar');
  if (totalPages <= 1) { bar.innerHTML = ''; return; }
  var cp = currentPage;
  var html = '';
  html += '<button class="page-btn" onclick="goPage(' + (cp - 1) + ')" ' + (cp === 1 ? 'disabled' : '') + '>&larr; Prev</button>';
  // Page numbers: show window around current page
  var pages = [];
  for (var i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= cp - 2 && i <= cp + 2)) pages.push(i);
    else if (pages[pages.length - 1] !== '...') pages.push('...');
  }
  pages.forEach(function(p) {
    if (p === '...') {
      html += '<span class="page-info">&hellip;</span>';
    } else {
      html += '<button class="page-btn' + (p === cp ? ' active' : '') + '" onclick="goPage(' + p + ')">' + p + '</button>';
    }
  });
  html += '<button class="page-btn" onclick="goPage(' + (cp + 1) + ')" ' + (cp === totalPages ? 'disabled' : '') + '>Next &rarr;</button>';
  html += '<span class="page-info">Showing ' + ((cp-1)*PAGE_SIZE+1).toLocaleString('en-IN') + '&ndash;' + Math.min(cp*PAGE_SIZE, total).toLocaleString('en-IN') + ' of ' + total.toLocaleString('en-IN') + '</span>';
  bar.innerHTML = html;
}

function goPage(p) {
  var totalPages = Math.ceil(filteredProperties.length / PAGE_SIZE);
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  renderCards(filteredProperties);
}

// ── Countdown ─────────────────────────────────────────────────────────
function startCountdowns() {
  countdownIntervals.forEach(clearInterval);
  countdownIntervals = [];
  var timers = document.querySelectorAll('.countdown-timer[data-date]');
  timers.forEach(function(el) {
    var d = el.dataset.date;
    var nums = el.querySelectorAll('.countdown-num');
    if (!nums.length) return;
    var iv = setInterval(function() {
      var t = timeLeft(d);
      if (nums[0]) nums[0].textContent = t.days;
      if (nums[1]) nums[1].textContent = pad(t.hours);
      if (nums[2]) nums[2].textContent = pad(t.minutes);
      if (t.days === 0 && t.hours === 0 && t.minutes === 0) clearInterval(iv);
    }, 60000);
    countdownIntervals.push(iv);
  });
}

// ── Map View ──────────────────────────────────────────────────────────
function renderMap(props) {
  if (!map) {
    map = L.map('mapContainer').setView([20.5937, 78.9629], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 18 }).addTo(map);
  }
  markers.forEach(function(m) { map.removeLayer(m); });
  markers = [];
  var bounds = [];
  // Only show entries with valid coords
  props.filter(function(p) { return p.lat && p.lng && p.lat !== 0 && p.lng !== 0; }).forEach(function(p) {
    var live = p.status === 'live', d = pctDisc(p.reservePrice, p.marketValue);
    var icon = L.divIcon({
      html: '<div style="background:' + (live ? '#ef4444' : '#1a56db') + ';color:white;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3)">' + fmtP(p.reservePrice) + '</div>',
      className: '', iconSize: [90, 28], iconAnchor: [45, 14]
    });
    var mk = L.marker([p.lat, p.lng], { icon: icon }).addTo(map);
    mk.bindPopup('<div style="min-width:200px"><img src="' + p.img + '" style="width:100%;height:100px;object-fit:cover;border-radius:8px;margin-bottom:8px"><strong>' + p.title + '</strong><br><small>' + p.city + '</small><br><div style="margin-top:6px;display:flex;justify-content:space-between"><span style="font-size:16px;font-weight:800;color:#10b981">' + fmtP(p.reservePrice) + '</span>' + (d > 0 ? '<span style="color:#10b981;font-weight:700">' + d + '% off</span>' : '') + '</div><button style="margin-top:8px;padding:6px 12px;background:#1a56db;color:white;border:none;border-radius:6px;cursor:pointer;width:100%" onclick="openModal(' + p.id + ')">View Details</button></div>');
    markers.push(mk);
    bounds.push([p.lat, p.lng]);
  });
  if (bounds.length) map.fitBounds(bounds, { padding: [50, 50] });
}

function setView(v) {
  currentView = v;
  var g = document.getElementById('propertyGrid'), m = document.getElementById('mapContainer');
  var pb = document.getElementById('paginationBar');
  document.getElementById('gridViewBtn').classList.toggle('active', v === 'grid');
  document.getElementById('mapViewBtn').classList.toggle('active', v === 'map');
  if (v === 'map') {
    g.classList.add('hidden'); m.classList.add('active'); pb.style.display = 'none';
    setTimeout(function() { if (map) map.invalidateSize(); renderMap(filteredProperties); }, 100);
  } else {
    g.classList.remove('hidden'); m.classList.remove('active'); pb.style.display = '';
  }
}

// ── Modal ─────────────────────────────────────────────────────────────
function openModal(id) {
  var p = properties.find(function(x) { return x.id === id; });
  if (!p) return;
  var d = pctDisc(p.reservePrice, p.marketValue);
  var fav = favorites.indexOf(p.id) !== -1;
  var live = p.status === 'live';
  var t = p.auctionDate ? timeLeft(p.auctionDate) : null;
  var sqftTxt = p.sqft && p.sqft > 0 ? p.sqft + ' sq.ft' : 'See Notice';
  var ppsf = p.sqft && p.sqft > 0 ? 'Rs.' + Math.round(p.reservePrice * 100000 / p.sqft).toLocaleString('en-IN') : 'N/A';
  var emi = p.reservePrice ? 'Rs.' + Math.round(p.reservePrice * 100000 * 0.0075).toLocaleString('en-IN') + '/mo' : 'N/A';
  var auctionDateStr = p.auctionDate ? new Date(p.auctionDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : 'TBD';
  var sourceLabel = p.source === 'ForeclosureIndia' ? '&#128279; View on ForeclosureIndia' : '&#128196; Download Notice';
  var sourceUrl = p.source === 'ForeclosureIndia' ? p.biddingUrl : '';

  document.getElementById('modalContent').innerHTML =
    '<button class="modal-close" onclick="closeModal()">&#10005;</button>' +
    '<div class="modal-gallery"><img src="' + p.img + '" alt="' + p.title + '" onerror="this.src=\'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800&q=80\'"></div>' +
    '<div class="modal-body">' +
    '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">' +
      '<span class="badge badge-type">' + p.type + '</span>' +
      (live ? '<span class="badge badge-live">&#9679; LIVE AUCTION</span>' : '<span class="badge badge-upcoming">UPCOMING</span>') +
      (d > 0 ? '<span class="badge badge-discount">' + d + '% Below Market</span>' : '') +
      '<span class="badge" style="background:var(--gray-100);color:var(--gray-600)">' + (p.source || 'IBAPI') + '</span>' +
    '</div>' +
    '<div class="modal-title">' + p.title + '</div>' +
    '<div class="modal-location">&#128205; ' + (p.area || '') + (p.city ? ', ' + p.city : '') + (p.state ? ', ' + p.state : '') + (p.pincode ? ' - ' + p.pincode : '') + '</div>' +
    '<div class="modal-grid">' +
      '<div class="modal-section"><h4>Pricing</h4>' +
        '<div class="modal-row"><span>Reserve Price</span><span style="color:#10b981;font-size:18px">' + fmtP(p.reservePrice) + '</span></div>' +
        (d > 0 ? '<div class="modal-row"><span>Market Value</span><span style="text-decoration:line-through;color:#9ca3af">' + fmtP(p.marketValue) + '</span></div>' +
        '<div class="modal-row"><span>You Save</span><span style="color:#10b981">' + fmtP(p.marketValue - p.reservePrice) + ' (' + d + '%)</span></div>' : '') +
        '<div class="modal-row"><span>EMI est. 20yr</span><span>' + emi + '</span></div>' +
      '</div>' +
      '<div class="modal-section"><h4>Property Details</h4>' +
        '<div class="modal-row"><span>Area</span><span>' + sqftTxt + '</span></div>' +
        '<div class="modal-row"><span>Floor</span><span>' + (p.floor || 'See Notice') + '</span></div>' +
        '<div class="modal-row"><span>Possession</span><span>' + (p.possession || 'See Notice') + '</span></div>' +
        '<div class="modal-row"><span>Rate/sq.ft</span><span>' + ppsf + '</span></div>' +
      '</div>' +
      '<div class="modal-section"><h4>Auction Info</h4>' +
        '<div class="modal-row"><span>Bank</span><span>' + (p.bankFull || p.bank) + '</span></div>' +
        '<div class="modal-row"><span>Date</span><span>' + auctionDateStr + '</span></div>' +
        '<div class="modal-row"><span>Application Deadline</span><span>' + (p.applicationDeadline || auctionDateStr) + '</span></div>' +
        '<div class="modal-row"><span>Borrower</span><span>' + (p.borrower || 'See Notice') + '</span></div>' +
      '</div>' +
      '<div class="modal-section"><h4>Legal &amp; Contact</h4>' +
        '<div class="modal-row"><span>Notice</span><span style="font-size:12px">' + (p.legalNotice || 'SARFAESI') + '</span></div>' +
        '<div class="modal-row"><span>Contact</span><span style="font-size:12px">' + (p.contact || p.bankFull || 'See Notice') + '</span></div>' +
        (p.amenities && p.amenities.length ? '<div style="margin-top:10px"><div style="font-size:11px;color:#9ca3af;font-weight:700;text-transform:uppercase;margin-bottom:6px">Amenities</div><div>' + p.amenities.map(function(a) { return '<span class="amenity-tag">' + a + '</span>'; }).join('') + '</div></div>' : '') +
      '</div>' +
    '</div>' +
    (t ? '<div class="card-countdown' + (live ? ' live' : '') + '" style="margin:0 0 20px">' +
      '<div class="countdown-label">' + (live ? '&#128308; Auction Ends In' : '&#8987; Auction Starts In') + '</div>' +
      '<div class="countdown-timer" data-date="' + p.auctionDate + '">' +
        '<div class="countdown-unit"><div class="countdown-num" style="font-size:28px;padding:6px 14px">' + t.days + '</div><div class="countdown-txt">Days</div></div>' +
        '<div class="countdown-unit"><div class="countdown-num" style="font-size:28px;padding:6px 14px">' + pad(t.hours) + '</div><div class="countdown-txt">Hrs</div></div>' +
        '<div class="countdown-unit"><div class="countdown-num" style="font-size:28px;padding:6px 14px">' + pad(t.minutes) + '</div><div class="countdown-txt">Min</div></div>' +
      '</div></div>' : '') +
    '<div class="modal-cta">' +
      '<button class="btn btn-primary" onclick="showToast(\'Bank: ' + (p.bankFull || p.bank || '') + '\')">&#128222; Contact Bank</button>' +
      '<button class="btn btn-outline" onclick="toggleFav(' + id + ');closeModal()">' + (fav ? 'Remove Saved' : 'Save Property') + '</button>' +
      (p.biddingUrl ? '<a class="btn btn-success" href="' + p.biddingUrl + '" target="_blank" rel="noopener" style="text-decoration:none">' + sourceLabel + '</a>' : '') +
    '</div>' +
    '</div>';

  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); document.body.style.overflow = ''; }

// ── Favorites ─────────────────────────────────────────────────────────
function toggleFav(id) {
  var i = favorites.indexOf(id);
  if (i === -1) { favorites.push(id); showToast('Saved to favorites!'); }
  else { favorites.splice(i, 1); showToast('Removed from saved'); }
  localStorage.setItem('bidflats_favs', JSON.stringify(favorites));
  updateFavCount(); applyFilters(); renderFavPanel();
}
function updateFavCount() { document.getElementById('favCount').textContent = favorites.length; }
function toggleFavPanel() {
  document.getElementById('favPanel').classList.toggle('open');
  document.getElementById('favOverlay').classList.toggle('open');
  if (document.getElementById('favPanel').classList.contains('open')) renderFavPanel();
}
function renderFavPanel() {
  var list = document.getElementById('favList');
  var fp = properties.filter(function(p) { return favorites.indexOf(p.id) !== -1; });
  if (!fp.length) {
    list.innerHTML = '<div style="padding:40px;text-align:center;color:#9ca3af"><div style="font-size:48px;margin-bottom:12px">&#10084;</div><p>No saved properties yet.</p></div>';
    return;
  }
  list.innerHTML = fp.map(function(p) {
    return '<div class="fav-item" onclick="toggleFavPanel();openModal(' + p.id + ')">' +
      '<img loading="lazy" src="' + p.img + '" alt="' + p.title + '" onerror="this.src=\'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400&q=70\'">' +
      '<div class="fav-item-info"><h4>' + p.title + '</h4><p>&#128205; ' + (p.area ? p.area + ', ' : '') + p.city + '</p><div class="fav-item-price">' + fmtP(p.reservePrice) + '</div></div>' +
    '</div>';
  }).join('');
}

// ── Toast ─────────────────────────────────────────────────────────────
function showToast(msg) {
  var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// ── CSV Download ──────────────────────────────────────────────────────
function downloadCSV() {
  var cols = ['ID', 'Title', 'Type', 'City', 'Area', 'State', 'Reserve Price (L)', 'Market Value (L)', 'Discount %', 'Bank', 'Auction Date', 'Status', 'Bidding URL', 'Source'];
  var rows = filteredProperties.map(function(p) {
    return [
      p.id, (p.title || '').replace(/,/g, ' '), p.type, p.city, (p.area || '').replace(/,/g, ' '),
      p.state || '', p.reservePrice, p.marketValue || '',
      pctDisc(p.reservePrice, p.marketValue),
      p.bankFull || p.bank,
      p.auctionDate ? new Date(p.auctionDate).toLocaleDateString('en-IN') : '',
      p.status, p.biddingUrl || '', p.source || ''
    ].join(',');
  });
  var csv = [cols.join(',')].concat(rows).join('\n');
  var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'bidflats_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('Downloaded ' + filteredProperties.length + ' properties');
}

// ── Keyboard shortcuts ────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeModal();
    if (document.getElementById('favPanel').classList.contains('open')) toggleFavPanel();
  }
});

// ── Init ──────────────────────────────────────────────────────────────
function init(props) {
  if (props && props.length > 0) {
    properties = props;
    populateFilters(props);
    var fi = props.filter(function(p) { return p.source === 'ForeclosureIndia'; }).length;
    var ibapi = props.filter(function(p) { return p.source !== 'ForeclosureIndia'; }).length;
    document.getElementById('dataSource').textContent =
      props.length.toLocaleString('en-IN') + ' listings (' + ibapi + ' IBAPI + ' + fi.toLocaleString('en-IN') + ' ForeclosureIndia)';
  }
  updateFavCount();
  applyFilters();
}

// Load properties.json
(function() {
  fetch('properties.json')
    .then(function(r) { if (!r.ok) throw new Error('no file'); return r.json(); })
    .then(function(data) { init(data); })
    .catch(function() { init([]); showToast('Could not load listings.'); });
})();
</script>
